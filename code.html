<!DOCTYPE html>

<html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary-fixed": "#dce3f0",
                    "on-secondary-fixed-variant": "#3e4755",
                    "on-surface-variant": "#5c403c",
                    "outline-variant": "#e6bdb8",
                    "on-tertiary-container": "#f5f7ff",
                    "tertiary-container": "#6b727d",
                    "surface-container-high": "#e7e8e9",
                    "on-error": "#ffffff",
                    "surface": "#f8f9fa",
                    "surface-tint": "#bf0715",
                    "error": "#ba1a1a",
                    "secondary": "#555f6d",
                    "on-secondary-container": "#596372",
                    "primary-fixed": "#ffdad6",
                    "surface-container-lowest": "#ffffff",
                    "error-container": "#ffdad6",
                    "on-secondary-fixed": "#121c28",
                    "surface-container-highest": "#e1e3e4",
                    "inverse-primary": "#ffb4ab",
                    "surface-variant": "#e1e3e4",
                    "surface-container-low": "#f3f4f5",
                    "surface-bright": "#f8f9fa",
                    "primary-container": "#dc2626",
                    "primary": "#b70011",
                    "on-tertiary-fixed-variant": "#404752",
                    "outline": "#916f6b",
                    "background": "#f8f9fa",
                    "on-error-container": "#93000a",
                    "tertiary": "#525a64",
                    "primary-fixed-dim": "#ffb4ab",
                    "tertiary-fixed-dim": "#c0c7d3",
                    "on-tertiary-fixed": "#151c25",
                    "on-primary": "#ffffff",
                    "secondary-container": "#d6e0f1",
                    "inverse-surface": "#2e3132",
                    "on-primary-fixed-variant": "#93000b",
                    "secondary-fixed-dim": "#bdc7d8",
                    "on-primary-fixed": "#410002",
                    "surface-dim": "#d9dadb",
                    "on-surface": "#191c1d",
                    "on-tertiary": "#ffffff",
                    "secondary-fixed": "#d9e3f4",
                    "on-background": "#191c1d",
                    "on-primary-container": "#fff6f5",
                    "on-secondary": "#ffffff",
                    "surface-container": "#edeeef",
                    "inverse-on-surface": "#f0f1f2"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "margin-desktop": "32px",
                    "section-gap": "48px",
                    "container-max": "1280px",
                    "margin-mobile": "16px",
                    "gutter": "24px",
                    "element-gap": "16px"
            },
            "fontFamily": {
                    "headline-xl": ["Inter"],
                    "headline-xl-mobile": ["Inter"],
                    "headline-md": ["Inter"],
                    "body-md": ["Inter"],
                    "headline-lg": ["Inter"],
                    "body-lg": ["Inter"],
                    "label-sm": ["Inter"]
            },
            "fontSize": {
                    "headline-xl": ["36px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-xl-mobile": ["28px", {"lineHeight": "1.2", "fontWeight": "700"}],
                    "headline-md": ["20px", {"lineHeight": "1.4", "fontWeight": "600"}],
                    "body-md": ["14px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "headline-lg": ["24px", {"lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "body-lg": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "label-sm": ["12px", {"lineHeight": "1.4", "letterSpacing": "0.01em", "fontWeight": "500"}]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        body { min-height: max(884px, 100dvh); }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile md:px-margin-desktop h-16 bg-surface border-b border-outline-variant">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary" data-icon="analytics">analytics</span>
<h1 class="font-headline-lg text-headline-lg text-on-surface whitespace-nowrap">11번가 전시입찰광고 매출현황</h1>
</div>
<div class="flex items-center gap-4">
<!-- AD symbol/badge removed per request -->
</div>
</header>
<!-- NavigationDrawer (Hidden on Mobile) -->
<aside class="hidden lg:flex flex-col fixed left-0 top-16 h-[calc(100vh-64px)] w-72 p-4 gap-element-gap bg-surface-container-low border-r border-outline-variant">
<div class="px-4 py-6">
<h2 class="font-headline-md text-headline-md font-black text-primary">광고 분석 시스템</h2>
</div>
<nav class="flex flex-col gap-2">
<a class="flex items-center gap-3 p-3 text-on-surface-variant hover:bg-surface-container-high rounded-xl transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
<span class="font-body-md">대시보드</span>
</a>
<a class="flex items-center gap-3 p-3 bg-secondary-container text-on-secondary-container rounded-xl font-bold transition-transform scale-[0.98]" href="#">
<span class="material-symbols-outlined" data-icon="query_stats">query_stats</span>
<span class="font-body-md">매출 분석</span>
</a>
<a class="flex items-center gap-3 p-3 text-on-surface-variant hover:bg-surface-container-high rounded-xl transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="ads_click">ads_click</span>
<span class="font-body-md">캠페인 관리</span>
</a>
<a class="flex items-center gap-3 p-3 text-on-surface-variant hover:bg-surface-container-high rounded-xl transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-body-md">시스템 설정</span>
</a>
</nav>
</aside>
<!-- Main Content Canvas -->
<main class="lg:ml-72 pt-16 min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop">
<div class="w-full max-w-[800px] flex flex-col items-center gap-element-gap">
<!-- Simplified Layout: Title and Upload Zone only -->
<div class="text-center mb-4">
<h2 class="font-headline-xl text-headline-xl text-on-surface">데이터 업로드</h2>
<p class="font-body-lg text-secondary mt-2">매출 분석을 시작하기 위해 파일을 선택해주세요.</p>
</div>
<!-- Upload Zone -->
<div class="w-full bg-white rounded-xl border-2 border-dashed border-outline-variant p-12 md:p-24 flex flex-col items-center justify-center gap-6 hover:border-primary hover:bg-surface-container-low transition-all group cursor-pointer">
<div class="w-24 h-24 rounded-full bg-surface-container-highest flex items-center justify-center group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-5xl text-primary" data-icon="upload_file">upload_file</span>
</div>
<div class="text-center">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">분석할 파일을 드래그하여 업로드하세요</h2>
<p class="font-body-lg text-secondary">또는 내 컴퓨터에서 파일 찾기 (Excel, CSV 지원)</p>
</div>
<div class="flex items-center gap-2 px-4 py-2 bg-surface-container rounded-full border border-outline-variant">
<span class="material-symbols-outlined text-secondary text-sm" data-icon="description">description</span>
<span class="font-label-sm text-secondary">최대 50MB까지 지원</span>
</div>
</div>
<!-- Action Button -->
<button class="mt-8 px-12 py-4 bg-primary text-on-primary font-headline-md rounded-xl hover:bg-primary-container shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-1 flex items-center gap-3">
<span class="material-symbols-outlined" data-icon="analytics">analytics</span>
<span>Analyze Data</span>
</button>
</div>
</main>
<!-- BottomNavBar (Visible on Mobile) -->
<nav class="lg:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-16 px-4 bg-surface/80 backdrop-blur-md border-t border-outline-variant shadow-lg">
<a class="flex flex-col items-center justify-center text-secondary" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-sm">홈</span>
</a>
<a class="flex flex-col items-center justify-center text-primary font-bold scale-95" href="#">
<span class="material-symbols-outlined" data-icon="bar_chart">bar_chart</span>
<span class="font-label-sm">분석</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary" href="#">
<span class="material-symbols-outlined" data-icon="list_alt">list_alt</span>
<span class="font-label-sm">관리</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-label-sm">설정</span>
</a>
</nav>
</body></html>
